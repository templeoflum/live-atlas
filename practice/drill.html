<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Navigation · Ableton Live, Mapped</title>
  <link rel="stylesheet" href="../atlas.css">
  <style>
    html,body{height:100%;overflow:hidden;overscroll-behavior:none}
    body{font-family:system-ui,-apple-system,sans-serif}
    .drill-scroll{height:100%;overflow:auto;overscroll-behavior:contain;min-height:0}
    main{max-width:760px;padding:clamp(24px,6vw,64px) 24px}
    .eyebrow{color:var(--ivory-dim)}
    h1{font-family:var(--f-disp);font-size:2.8rem;font-weight:500;line-height:1.15;margin:12px 0 24px}
    hr{border:0;border-top:1px solid var(--ivory-dim);margin-bottom:24px}
    p{max-width:66ch;color:var(--ivory-dim)}
    .prompt{margin-top:32px;border:1px solid var(--ivory-dim);border-radius:10px;padding:24px;background:var(--lacquer)}
    h2{font-size:1.5rem;line-height:1.35;height:4.05em;margin:0;font-weight:500}
    .card-link{height:3.4em;margin:12px 0}
    a{color:var(--brass)}
    button{font:inherit;color:var(--ivory);border:1px solid var(--ivory-dim);background:var(--lacquer2);border-radius:4px;padding:10px 18px;cursor:pointer}
    button:focus,a:focus{outline:2px solid var(--brass);outline-offset:4px}
    #keys{width:100%;min-height:60px;text-align:left}
    #keys:focus{background:var(--brass);color:var(--ebony)}
    #feedback{height:4em;margin:18px 0 0;color:var(--ivory);font-family:var(--f-mono);font-size:1.15rem}
    nav{display:flex;justify-content:space-between;margin-top:24px}
    .condition{margin-top:24px}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
  <script src="../manual-data.js" defer></script>
  <script src="../shortcut-explorer.js" defer></script>
  <script src="drill.js" defer></script>
</head>
<body>
  <div class="drill-scroll">
    <main>
      <div class="eyebrow">Workspace · Navigation · Mac</div>
      <h1>Navigation</h1>
      <hr>
      <p>Key recall only. Browser keys do not control Live.</p>
      <section class="prompt" aria-labelledby="action">
        <h2 id="action"></h2>
        <p class="card-link"><a id="card" target="_blank" rel="noopener">Atlas card</a></p>
        <button id="keys" type="button">Press keys · Escape exits</button>
        <p id="feedback" role="status" aria-live="polite"></p>
        <nav aria-label="Actions"><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></nav>
      </section>
      <p class="condition">In Live: Tab switches views when Use Tab to Move Focus is off.</p>
    </main>
  </div>
</body>
</html>
