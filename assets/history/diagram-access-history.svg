<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="diagram-access-history-title diagram-access-history-desc"><title id="diagram-access-history-title">Move focus, hear the control</title><desc id="diagram-access-history-desc">Tab moves keyboard focus to the next control, Shift-Tab moves back, and the screen reader announces the focused control. This requires the relevant keyboard-navigation and accessibility settings.</desc><rect width="640" height="280" rx="8" fill="#171110"/><g font-family="system-ui, sans-serif"><text x="321" y="36" fill="#c8a44d" font-size="22" text-anchor="middle">Tab →</text><rect x="24" y="64" width="169" height="70" rx="6" fill="#29221e" stroke="#66584d"/><text x="108.5" y="106" fill="#ece3d2" font-size="20" text-anchor="middle">Control</text><path d="M205 99L227 99" fill="none" stroke="#c8a44d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="227,99 219.01704569498645,103.15601257987335 219.01704569498645,94.84398742012665" fill="#c8a44d"/><rect x="237" y="58" width="172" height="82" rx="6" fill="#344d43" stroke="#83c4ae"/><text x="323" y="105" fill="#83c4ae" font-size="24" text-anchor="middle">Focus</text><path d="M423 99L445 99" fill="none" stroke="#c8a44d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="445,99 437.01704569498645,103.15601257987335 437.01704569498645,94.84398742012665" fill="#c8a44d"/><rect x="457" y="64" width="158" height="70" rx="6" fill="#29221e" stroke="#66584d"/><text x="536" y="106" fill="#ece3d2" font-size="20" text-anchor="middle">Control</text><text x="321" y="176" fill="#c8a44d" font-size="22" text-anchor="middle">← Shift + Tab</text><path d="M324 186L324 206" fill="none" stroke="#83c4ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="324,206 319.84398742012667,198.01704569498645 328.15601257987333,198.01704569498645" fill="#83c4ae"/><rect x="183" y="215" width="282" height="49" rx="6" fill="#29221e" stroke="#66584d"/><text x="324" y="246.5" fill="#83c4ae" font-size="20" text-anchor="middle">Spoken name / value</text></g></svg>