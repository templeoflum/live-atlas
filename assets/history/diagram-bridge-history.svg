<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="diagram-bridge-history-title diagram-bridge-history-desc"><title id="diagram-bridge-history-title">Two directions through The Bridge</title><desc id="diagram-bridge-history-desc">A DJ deck controls a Live production through Ableton Transport Control. A recorded Serato performance can become an editable Live Set with song placement and fader movements.</desc><rect width="640" height="280" rx="8" fill="#171110"/><g font-family="system-ui, sans-serif"><text x="25" y="38" fill="#c8a44d" font-size="22" text-anchor="start">Perform</text><circle cx="78" cy="99" r="39" fill="#29221e" stroke="#c8a44d"/><circle cx="78" cy="99" r="8" fill="#c8a44d" stroke="none"/><path d="M121 64L104 96" fill="none" stroke="#ece3d2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M144 99L254 99" fill="none" stroke="#c8a44d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="254,99 246.01704569498645,103.15601257987335 246.01704569498645,94.84398742012665" fill="#c8a44d"/><rect x="266" y="67" width="350" height="65" rx="6" fill="#29221e" stroke="#66584d"/><text x="441" y="106.5" fill="#c8a44d" font-size="20" text-anchor="middle">Control a Live production</text><text x="25" y="182" fill="#83c4ae" font-size="22" text-anchor="start">Record</text><rect x="25" y="201" width="233" height="61" rx="6" fill="#29221e" stroke="#66584d"/><text x="141.5" y="238.5" fill="#83c4ae" font-size="20" text-anchor="middle">Serato performance</text><path d="M270 231L347 231" fill="none" stroke="#83c4ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="347,231 339.01704569498645,235.15601257987333 339.01704569498645,226.84398742012667" fill="#83c4ae"/><rect x="360" y="201" width="256" height="61" rx="6" fill="#29221e" stroke="#66584d"/><text x="488" y="238.5" fill="#83c4ae" font-size="20" text-anchor="middle">Editable Live Set</text></g></svg>