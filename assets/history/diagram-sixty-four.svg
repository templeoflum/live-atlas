<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="diagram-sixty-four-title diagram-sixty-four-desc"><title id="diagram-sixty-four-title">Past the 32-bit memory ceiling</title><desc id="diagram-sixty-four-desc">A 32-bit process has a four-gigabyte address-space ceiling. A 64-bit application can address memory beyond that boundary. The drawing does not state a maximum for 64-bit Live or imply improved audio resolution.</desc><rect width="640" height="280" rx="8" fill="#171110"/><g font-family="system-ui, sans-serif"><text x="25" y="38" fill="#b9ac98" font-size="22" text-anchor="start">32-bit application</text><text x="25" y="152" fill="#83c4ae" font-size="22" text-anchor="start">64-bit application</text><rect x="25" y="58" width="60" height="53" rx="3" fill="#665635" stroke="#c8a44d"/><rect x="94" y="58" width="60" height="53" rx="3" fill="#665635" stroke="#c8a44d"/><rect x="163" y="58" width="60" height="53" rx="3" fill="#665635" stroke="#c8a44d"/><rect x="232" y="58" width="60" height="53" rx="3" fill="#665635" stroke="#c8a44d"/><path d="M309 49V123" fill="none" stroke="#d98189" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="331" y="81" fill="#d98189" font-size="22" text-anchor="start">4 GB ceiling</text><text x="331" y="108" fill="#b9ac98" font-size="16" text-anchor="start">Usable memory can be lower</text><rect x="25" y="172" width="60" height="53" rx="3" fill="#344d43" stroke="#83c4ae"/><rect x="94" y="172" width="60" height="53" rx="3" fill="#344d43" stroke="#83c4ae"/><rect x="163" y="172" width="60" height="53" rx="3" fill="#344d43" stroke="#83c4ae"/><rect x="232" y="172" width="60" height="53" rx="3" fill="#344d43" stroke="#83c4ae"/><rect x="301" y="172" width="60" height="53" rx="3" fill="#344d43" stroke="#83c4ae"/><rect x="370" y="172" width="60" height="53" rx="3" fill="#344d43" stroke="#83c4ae"/><rect x="439" y="172" width="60" height="53" rx="3" fill="#344d43" stroke="#83c4ae"/><rect x="508" y="172" width="60" height="53" rx="3" fill="#344d43" stroke="#83c4ae"/><path d="M589 198L617 198" fill="none" stroke="#83c4ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="617,198 609.0170456949865,202.15601257987333 609.0170456949865,193.84398742012667" fill="#83c4ae"/><text x="25" y="261" fill="#ece3d2" font-size="21" text-anchor="start">Memory addressing ≠ audio bit depth</text></g></svg>