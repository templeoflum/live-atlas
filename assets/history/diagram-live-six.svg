<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="diagram-live-six-title diagram-live-six-desc"><title id="diagram-live-six-title">One Macro, several parameters</title><desc id="diagram-live-six-desc">One Macro control branches to filter, drive and level controls in a Rack. These are illustrative mappings, not a historical factory preset.</desc><rect width="640" height="280" rx="8" fill="#171110"/><g font-family="system-ui, sans-serif"><circle cx="112" cy="139" r="47" fill="#29221e" stroke="#c8a44d"/><path d="M112 139L134 109" fill="none" stroke="#c8a44d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="112" y="219" fill="#c8a44d" font-size="23" text-anchor="middle">Macro</text><path d="M160 139H261V54H380M261 139H380M261 139V225H380" fill="none" stroke="#c8a44d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="390" y="26" width="221" height="56" rx="6" fill="#29221e" stroke="#66584d"/><text x="500.5" y="61" fill="#83c4ae" font-size="20" text-anchor="middle">Filter</text><rect x="390" y="111" width="221" height="56" rx="6" fill="#29221e" stroke="#66584d"/><text x="500.5" y="146" fill="#d98189" font-size="20" text-anchor="middle">Drive</text><rect x="390" y="197" width="221" height="56" rx="6" fill="#29221e" stroke="#66584d"/><text x="500.5" y="232" fill="#8fa9ca" font-size="20" text-anchor="middle">Level</text></g></svg>