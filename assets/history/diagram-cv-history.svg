<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="diagram-cv-history-title diagram-cv-history-desc"><title id="diagram-cv-history-title">Across the cable</title><desc id="diagram-cv-history-desc">Live’s CV Tools send pitch, clock and modulation through a compatible DC-coupled interface to modular hardware. CV Clock In can make Live follow the modular clock.</desc><rect width="640" height="280" rx="8" fill="#171110"/><g font-family="system-ui, sans-serif"><rect x="22" y="82" width="145" height="70" rx="6" fill="#29221e" stroke="#66584d"/><text x="94.5" y="124" fill="#c8a44d" font-size="20" text-anchor="middle">CV Tools</text><path d="M176 116L227 116" fill="none" stroke="#c8a44d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="227,116 219.01704569498645,120.15601257987335 219.01704569498645,111.84398742012665" fill="#c8a44d"/><rect x="237" y="71" width="171" height="92" rx="6" fill="#29221e" stroke="#66584d"/><text x="322.5" y="124" fill="#83c4ae" font-size="20" text-anchor="middle">Interface</text><path d="M416 116L462 116" fill="none" stroke="#83c4ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><polygon points="462,116 454.01704569498645,120.15601257987335 454.01704569498645,111.84398742012665" fill="#83c4ae"/><rect x="472" y="62" width="145" height="124" rx="6" fill="#29221e" stroke="#66584d"/><rect x="484" y="73" width="31" height="102" rx="6" fill="#29221e" stroke="#66584d"/><circle cx="500" cy="104" r="8" fill="#c8a44d" stroke="none"/><circle cx="500" cy="153" r="5" fill="#83c4ae" stroke="none"/><rect x="524" y="73" width="31" height="102" rx="6" fill="#29221e" stroke="#66584d"/><circle cx="540" cy="104" r="8" fill="#c8a44d" stroke="none"/><circle cx="540" cy="153" r="5" fill="#83c4ae" stroke="none"/><rect x="564" y="73" width="31" height="102" rx="6" fill="#29221e" stroke="#66584d"/><circle cx="580" cy="104" r="8" fill="#c8a44d" stroke="none"/><circle cx="580" cy="153" r="5" fill="#83c4ae" stroke="none"/><text x="322" y="40" fill="#b9ac98" font-size="18" text-anchor="middle">DC-coupled</text><text x="24" y="218" fill="#b9ac98" font-size="20" text-anchor="start">Pitch · clock · modulation →</text><text x="24" y="252" fill="#83c4ae" font-size="20" text-anchor="start">← Modular clock can lead Live</text></g></svg>